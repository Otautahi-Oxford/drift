[package]
name = "kernels"
version = "0.1.0"
edition = "2024"
license = "MIT AND BSD-2-Clause AND BSD-3-Clause"

[dependencies]
cuda_std = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "cuda_std", branch = "main", optional = true }
cuda-core = { workspace = true, optional = true }
cuda-device = { workspace = true, optional = true }
cuda-host = { workspace = true, optional = true }
glam = { version = "0.33.0", default-features = false, features = ["cuda", "nostd-libm", "u32"] }
libm = "0.2.11"
shared = { path = "../shared" }

[features]
default = []
rust-cuda = ["dep:cuda_std"]
cuda-oxide = ["dep:cuda-core", "dep:cuda-device", "dep:cuda-host"]

[lib]
crate-type = ["cdylib", "rlib"]
