[package]
name = "drift"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Otautahi-Oxford/drift"
license = "MIT AND BSD-2-Clause AND BSD-3-Clause"

[lib]
name = "drift_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
shared = { path = "shared" }
pyo3 = "0.28.3"
cust = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "cust", branch = "main", optional = true }
cuda-core = { workspace = true, optional = true }
cuda-host = { workspace = true, optional = true }
kernels = { path = "kernels", default-features = false, optional = true }
ndarray-rand = "0.16.0"
rand = "0.10.1"
rayon = "1.11.0"
libm = "0.2.11"
numpy = "0.28.0"
libc = "0.2.177"
log = "0.4.30"
pyo3-log = "0.13.4"
thiserror = "2.0.17"

[build-dependencies]
cuda_builder = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "cuda_builder", branch = "main", features = ["rustc_codegen_nvvm"], optional = true }

[package.metadata.maturin]
name = "drift"

[workspace]
members = ["shared", "kernels", "."]

[workspace.dependencies]
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "754b6d10e26919dfb2689d4e1d33da56ad039918" }
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "754b6d10e26919dfb2689d4e1d33da56ad039918" }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "754b6d10e26919dfb2689d4e1d33da56ad039918" }

[features]
default = ["cuda-oxide"]
extension-module = ["pyo3/extension-module"]
rust-cuda = ["dep:cust", "dep:cuda_builder"]
cuda-oxide = ["dep:cuda-core", "dep:cuda-host", "dep:kernels", "kernels/cuda-oxide"]


[target.'cfg(unix)'.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }

[target.'cfg(windows)'.dependencies]
# Nothing here — we explicitly do NOT support Windows

# [profile.release]
# opt-level = 2
# codegen-units = 1
# debug = false

# [profile.test]
# opt-level = 2
# codegen-units = 1
# debug = false

[profile.dev]
opt-level = 0
debug = 2
